name: CI

# CQ-8 per-change product validation: lint, types, unit, PostgreSQL integration,
# and ordinary product Playwright tests run once per branch through its pull
# request. Main pushes are validated by deploy.yml's gate-then-confirm, which
# runs the identical suite — running it here too doubled every push's cost
# for no extra signal (removed 2026-08-23).
# Fresh-clone E0/E1 certification is kept independently visible in
# certification.yml; it is intentionally not recursive inside this UI gate.
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      # PORT is explicit and never a bare well-known port (ARCHITECTURE.md
      # §9). No pin for the test database's port: ADR-0013's ephemeral port
      # is exactly what a shared runner needs, so nothing here picks a
      # number for it.
      PORT: "4310"
      # §8 required variables, from repository secrets — placeholders only,
      # no value lives in this file (SEC-7).
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SOURCE_REF_SALT: ${{ secrets.SOURCE_REF_SALT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # Same Node major as package.json's @types/node (^22.10.0) — a
          # skewed major here makes a CI-only failure unexplainable.
          node-version: "22"
          cache: npm

      - name: Start phase timing record
        run: |
          echo '## CI phase timings' >> "$GITHUB_STEP_SUMMARY"
          echo '| Phase | Duration |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | ---: |' >> "$GITHUB_STEP_SUMMARY"

      - name: Setup — npm dependencies
        run: |
          started=$SECONDS
          npm ci
          echo "| dependency setup | $((SECONDS - started))s |" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version=$(node -p "require('./node_modules/@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}-${{ steps.playwright-version.outputs.version }}

      # Resolves against the @playwright/test version npm ci just installed
      # from package-lock.json. The cache key binds both the lockfile and that
      # resolved version, so a browser build never floats across upgrades.
      - name: Setup — Playwright browser
        timeout-minutes: 5
        run: |
          started=$SECONDS
          npx playwright install chromium
          echo "| Playwright setup | $((SECONDS - started))s |" >> "$GITHUB_STEP_SUMMARY"

      - name: Product UI gate
        run: scripts/gate.sh ui
