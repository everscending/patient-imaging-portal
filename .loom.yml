# Repo-layer loom config (see loom's references/loom-config.md).
# gates: the tier keys this repo uses and the literal command each tier runs.
# docs/adr/0012-phase-4-closures.md removed the `docs` tier — it traced to no
# requirement, so a document-only ticket takes `logic`. Three tiers only.
# Tiers are cumulative: api repeats logic's commands, ui repeats api's
# (ARCHITECTURE.md §15) — a tier that skipped its parent would let a type
# error through an end-to-end pass. scripts/gate.sh resolves the identical
# list per tier; tests/gate/gate.test.ts asserts the two never drift apart.
gates:
  logic:
    - "npx tsc --noEmit"
    - "npx eslint ."
    - "npx vitest run --project unit"
  api:
    - "npx tsc --noEmit"
    - "npx eslint ."
    - "npx vitest run --project unit"
    - "npx vitest run --project unit tests/observability/timing.test.ts"
    - "npx vitest run --project integration tests/integration tests/scheduling/booking-concurrency.test.ts"
    - "npx vitest run --project e8"
  ui:
    - "npx tsc --noEmit"
    - "npx eslint ."
    - "npx vitest run --project unit"
    - "npx vitest run --project unit tests/observability/timing.test.ts"
    - "npx vitest run --project integration tests/integration tests/scheduling/booking-concurrency.test.ts"
    - "npx vitest run --project e8"
    - "npx playwright test e2e/e8-wiring.spec.ts --project=e8-wiring"
    - "node scripts/validate-playwright-report.mjs test-results/playwright.json e2e/e8-wiring.spec.ts"
    - "npx playwright test e2e/e5-wiring.spec.ts --project=e5-wiring"
    - "node scripts/validate-playwright-report.mjs test-results/playwright.json e2e/e5-wiring.spec.ts"
    - "npx playwright test e2e/book.spec.ts --project=product"
    - "node scripts/validate-playwright-report.mjs test-results/playwright.json e2e/book.spec.ts"
    - "npx playwright test e2e/provider-schedule.spec.ts --project=product"
    - "node scripts/validate-playwright-report.mjs test-results/playwright.json e2e/provider-schedule.spec.ts"
    - "npx playwright test --project=e2-wiring"
    - "node scripts/validate-playwright-report.mjs test-results/playwright.json e2e/e2-wiring.spec.ts"
    - "npx playwright test --project=e4-wiring"
    - "node scripts/validate-playwright-report.mjs test-results/playwright.json e2e/e4-wiring.spec.ts"
