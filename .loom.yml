# Repo-layer loom config (see loom's references/loom-config.md).
# gates: the tier keys this repo uses and the literal command each tier runs.
# docs/adr/0012-phase-4-closures.md removed the `docs` tier — it traced to no
# requirement, so a document-only ticket takes `logic`. Three tiers only.
# Tiers are cumulative: api repeats logic's commands, ui repeats api's
# (ARCHITECTURE.md §15) — a tier that skipped its parent would let a type
# error through an end-to-end pass. scripts/gate.sh resolves the identical
# list per tier; tests/gate/gate.test.ts asserts the two never drift apart.
max_lanes: 2

gates:
  logic:
    - "npx tsc --noEmit"
    - "npx eslint ."
    - "npx vitest run --project unit"
    - "npx vitest run --project unit tests/coverage-config.test.ts"
    - "npx vitest run --coverage --project unit --project integration"
    - "npx vitest run --project unit tests/performance/performance-contract.test.ts"
    - "npx vitest run --project unit tests/performance/el1-benchmark-contract.test.ts"
  api:
    - "npx tsc --noEmit"
    - "npx eslint ."
    - "npx vitest run --project unit"
    - "npx vitest run --project unit tests/coverage-config.test.ts"
    - "npx vitest run --coverage --project unit --project integration"
    - "npx vitest run --project unit tests/performance/performance-contract.test.ts"
    - "npx vitest run --project unit tests/performance/el1-benchmark-contract.test.ts"
    - "npx vitest run --project unit tests/adversarial/cross-patient.test.ts"
    - "npx vitest run --project unit tests/observability/timing.test.ts"
    - "npx vitest run --project integration tests/integration tests/scheduling/booking-concurrency.test.ts"
    - "npx vitest run --project e8"
  ui:
    - "npx tsc --noEmit"
    - "npx eslint ."
    - "npx vitest run --project unit"
    - "npx vitest run --project unit tests/coverage-config.test.ts"
    - "npx vitest run --coverage --project unit --project integration"
    - "npx vitest run --project unit tests/performance/performance-contract.test.ts"
    - "npx vitest run --project unit tests/performance/el1-benchmark-contract.test.ts"
    - "npx vitest run --project unit tests/adversarial/cross-patient.test.ts"
    - "npx vitest run --project unit tests/observability/timing.test.ts"
    - "npx vitest run --project integration tests/integration tests/scheduling/booking-concurrency.test.ts"
    - "npx vitest run --project e8"
    - "npx playwright test --project=product --project=e2-wiring --project=e3-wiring --project=e4-wiring --project=e5-wiring --project=e8-wiring"
    - "node scripts/validate-playwright-report.mjs test-results/playwright.json e2e/e8-wiring.spec.ts"
    - "node scripts/validate-playwright-report.mjs test-results/playwright.json e2e/e10-wiring.spec.ts"
    - "node scripts/validate-playwright-report.mjs test-results/playwright.json e2e/e9-wiring.spec.ts"
